[package]
name = "engramdb"
version = "0.14.0"
edition = "2021"
description = "EngramDB - 专用分析型嵌入 AI Agent 数据引擎。兼具 SQLite 的事务能力与 DuckDB 的列存压缩分析性能，单文件嵌入式部署。"
license = "MIT"
repository = "https://github.com/sn0wfree/EngramDB"
readme = "README.md"
keywords = ["database", "embedded", "column-store", "analytical", "vector-search"]
categories = ["database", "database-implementations"]

[lib]
name = "engramdb"
path = "src/lib.rs"

[[bin]]
name = "engramdb"
path = "src/main.rs"

[features]
default = []
# DataFusion 互操作（启用后编译 datafusion_ext 模块与集成测试）
datafusion = ["dep:datafusion", "dep:datafusion-common", "dep:datafusion-expr"]

[dependencies]
# 解析
nom = "7.1"

# 错误处理
thiserror = "1.0"

# 序列化
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# 字节操作
bytes = "1.5"

# 时间
chrono = "0.4"

# 日志
log = "0.4"
env_logger = "0.11"

# v0.18 实验：jemalloc 全局分配器（小对象分配优势；bench 验证无收益则回退）
jemallocator = "0.5"

# 哈希
fxhash = "0.2"

# 随机数（跳表、布隆过滤器、测试）
rand = "0.8"

# SQL 解析器 - 成熟方案 sqlparser-rs (Apache DataFusion 也用它)
# 轻量、零额外重依赖、社区活跃、支持 ANSI SQL:2016
sqlparser = "0.47"

# JSON 处理（v0.12.0 新增，Agent 元数据存储）
serde_json = "1.0"

# DataFusion 互操作（可选，启用 datafusion feature 时生效）
datafusion = { version = "40", optional = true }
datafusion-common = { version = "40", optional = true }
datafusion-expr = { version = "40", optional = true }

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
rusqlite = "0.31"

# 基准测试目标（均自带 main()，需关闭默认 test harness）
[[bench]]
name = "m1_acceptance_bench"
harness = false

[[bench]]
name = "m2_memory_bench"
harness = false

[[bench]]
name = "m3_log_bench"
harness = false

[[bench]]
name = "p35_bloom_bench"
harness = false

[[bench]]
name = "bench_main"
harness = false

[[bench]]
name = "bench_full"
harness = false

[[bench]]
name = "compression_bench"
harness = false

[[bench]]
name = "compression_bench_v2"
harness = false

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "index_bench"
harness = false

[[bench]]
name = "vector_bench"
harness = false

[[bench]]
name = "limit_bench"
harness = false

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "compact_strategy_bench"
harness = false

[[bench]]
name = "compact_strategy_deep_bench"
harness = false

[[bench]]
name = "v0_13_acceptance_bench"
harness = false

[[bench]]
name = "select_star_bench"
harness = false

# 编译加速配置：
# - dev: 跳过完整 debug info（行号保留，够用），加速冷启动编译
# - bench 目标独立 profile：基准测量需要优化，但保持轻量编译
[profile.dev]
debug = "line-tables-only"
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.bench]
opt-level = 3
debug = false
codegen-units = 256

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
lto = "thin"


[[bench]]
name = "v018_write_bench"
harness = false
