[package]
name = "hybriddb"
version = "0.12.0"
edition = "2021"
description = "HybridDB - 专用分析型嵌入 AI Agent 数据引擎。兼具 SQLite 的事务能力与 DuckDB 的列存压缩分析性能，单文件嵌入式部署。"
license = "MIT"
repository = "https://github.com/sn0wfree/HybridDB"
readme = "README.md"
keywords = ["database", "embedded", "column-store", "analytical", "vector-search"]
categories = ["database", "database-implementations"]

[lib]
name = "hybriddb"
path = "src/lib.rs"

[[bin]]
name = "hybriddb"
path = "src/main.rs"

[dependencies]
# 解析
nom = "7.1"

# 错误处理
thiserror = "1.0"

# 序列化
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# 字节操作
bytes = "1.5"

# 时间
chrono = "0.4"

# 日志
log = "0.4"
env_logger = "0.11"

# 哈希
fxhash = "0.2"

# 随机数（跳表、布隆过滤器、测试）
rand = "0.8"

# SQL 解析器 - 成熟方案 sqlparser-rs (Apache DataFusion 也用它)
# 轻量、零额外重依赖、社区活跃、支持 ANSI SQL:2016
sqlparser = "0.47"

# JSON 处理（v0.12.0 新增，Agent 元数据存储）
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"

