name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # v0.22.4：移除全局 `-D warnings`——仓库存在 ~74 处预存警告（unused
  # import/variable 等），此前 Build/Clippy job 从未绿过、测试从未在
  # CI 真正跑过。警告清单已留档，治理后续推进；编译错误（error[E*]）
  # 与测试失败仍然照常阻塞本 job。
  #
  # 注意：cargo check/build 需执行依赖的 build script（proc-macro2 /
  # zstd-sys 等），EngramDB 开发机因 Smart App Control 拦截未签名产物
  # 无法本地编译，CI 是唯一编译验证环境。

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (default features)
        run: cargo clippy --all-targets --all-features
      - name: Clippy (datafusion feature)
        run: cargo clippy --features datafusion --all-targets

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Run tests (default)
        run: cargo test --verbose
      - name: Run tests (datafusion feature)
        run: cargo test --features datafusion --verbose
      - name: Build benchmarks
        run: cargo build --benches --verbose
