name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # v0.22.4：移除全局 `-D warnings`——仓库存在 ~74 处预存警告（unused
  # import/variable 等），此前 Build/Clippy job 从未绿过、测试从未在
  # CI 真正跑过。警告清单已留档，治理后续推进；编译错误（error[E*]）
  # 与测试失败仍然照常阻塞本 job。
  #
  # 注意：cargo check/build 需执行依赖的 build script（proc-macro2 /
  # zstd-sys 等），EngramDB 开发机因 Smart App Control 拦截未签名产物
  # 无法本地编译，CI 是唯一编译验证环境。

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # v0.22.4：非阻塞。datafusion 依赖树的 arrow-arith 52.2.0 与 chrono
    # 0.4.45 存在第三方不兼容（ChronoDateExt::quarter 歧义，E0034），
    # 等依赖树升级后恢复阻塞。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (default features)
        run: cargo clippy --all-targets --all-features
      - name: Clippy (datafusion feature)
        run: cargo clippy --features datafusion --all-targets

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Run tests (default)
        run: cargo test --verbose
      # datafusion 依赖树与 chrono 0.4.45 不兼容（见 clippy job 注释），
      # 默认 feature 才是核心验证；datafusion 步骤非阻塞
      - name: Run tests (datafusion feature)
        run: cargo test --features datafusion --verbose
        continue-on-error: true
      - name: Build benchmarks
        run: cargo build --benches --verbose
